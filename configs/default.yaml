model:
  image_size: 224
  in_channels: 3
  patch_size: 4
  visual_embed_dim: 128
  transformer_layers: 4
  num_heads: 8
  ff_dim: 512
  dropout: 0.1
  max_ui_elements: 16
  gnn_layers: 2
  output_dim: 128
  detector_backend: placeholder
  yolo_model_path: yolov8n.pt
  yolo_conf_threshold: 0.25
  yolo_iou_threshold: 0.7

train:
  batch_size: 8
  learning_rate: 0.0001
  epochs: 5
  ux_loss_weight: 1.0
  layout_loss_weight: 0.5
  attention_loss_weight: 0.5
  use_wandb: true
  wandb_project: CV project
