[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uxqa"
version = "0.1.0"
description = "Multi-modal UX quality assessment scaffold"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2.0",
  "pyyaml>=6.0.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
