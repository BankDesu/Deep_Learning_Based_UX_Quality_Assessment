[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uxqa"
version = "0.1.0"
description = "Multi-modal UX quality assessment scaffold"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2.0",
  "torchvision>=0.17.0",
  "timm>=1.0.0",
  "pyyaml>=6.0.1",
  "wandb>=0.17.0",
  "scipy>=1.12.0",
  "Pillow>=10.0.0",
]

[project.optional-dependencies]
yolo = [
  "ultralytics>=8.2.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
